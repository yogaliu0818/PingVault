name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run unit and smoke tests
        env:
          QT_QPA_PLATFORM: offscreen
          PINGVAULT_NO_ADMIN: '1'
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Compile check
        run: python -m compileall -q main.py pingvault tests

  package:
    runs-on: windows-2022
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Build application folder
        shell: pwsh
        run: ./scripts/build_exe.ps1

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: PingVault-windows
          path: dist/PingVault/
